name: Daily Policy Briefing

on:
  schedule:
    # Runs at 06:00, 12:00, 16:00, and 20:00 Israel Time (IDT, UTC+3)
    # Corresponding UTC hours: 03:00, 09:00, 13:00, 17:00
    - cron: "0 3,9,13,17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper + analyzer + dashboard build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit updated data files back to repo
        run: |
          git config user.name "policy-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/seen_hashes.json
          git diff --cached --quiet && echo "No data changes to commit" || \
            git commit -m "chore: update briefing data [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4